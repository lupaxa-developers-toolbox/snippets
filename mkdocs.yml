# =============================================================================
# Site Information
# =============================================================================

site_name: Snippets

site_description: >-
  A curated collection of code snippets for Shell, Python, Ruby, and other
  languages.

site_author: The Lupaxa Project

site_url: https://snippets.thelupaxaproject.org/

repo_name: lupaxa-developers-toolbox/snippets
repo_url: https://github.com/lupaxa-developers-toolbox/snippets

extra:
  generator: false
  # Desktop: no left column (header lists Home | Snippets | Languages).
  # Tablet/phone: primary sidebar stays in the DOM as Material's drawer.
  # Default when omitted: false (left nav visible on desktop).
  hide_primary_sidebar: true
  hide_secondary_sidebar: true
  # Optional short label for the header GitHub link.
  # If omitted, uses the repo segment of repo_name (org/repo → repo).
  repo_display_name: snippets
  # Footer (rendered by overrides/partials/copyright.html; year set in-browser).
  start_year: 2025
  footer_name: The Lupaxa Project
  footer_taglines:
    - Where exploration meets precision.
    - Where the untamed meets the engineered.
  # Counter.dev analytics (omit counter_dev_id to disable).
  counter_dev_id: ef410665-76d4-43fe-9e91-53f26ed1004b
  counter_dev_utcoffset: 0
  social_image: assets/images/the-lupaxa-project-social-card.png
  social_image_width: 1200
  social_image_height: 630
  social_logo: assets/images/logo.png
  social_locale: en_GB
  theme_color: "#203959"
  twitter_card: summary_large_image

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs
site_dir: site
use_directory_urls: true

validation:
  links:
    absolute_links: warn

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png

  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.sections
    - toc.follow

  palette:
    scheme: slate
    primary: blue
    accent: light-blue

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Plugins
# =============================================================================

# Catalogue filter panel is the search UI. Empty list disables Material search
# (omitting plugins: would re-enable MkDocs' default search plugin).
plugins: []

hooks:
  - mkdocs_hooks.py

watch:
  - data
  - mkdocs_hooks.py
  - overrides
  - snippets
  - src/snippets_mkdocs

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/00-tokens.css
  - assets/stylesheets/10-base.css
  - assets/stylesheets/20-layout.css
  - assets/stylesheets/30-navigation.css
  - assets/stylesheets/40-components/buttons.css
  - assets/stylesheets/40-components/cards.css
  - assets/stylesheets/40-components/catalogue.css
  - assets/stylesheets/40-components/filter-panel.css
  - assets/stylesheets/40-components/footer.css
  - assets/stylesheets/40-components/hero.css
  - assets/stylesheets/40-components/snippet-modal.css
  - assets/stylesheets/40-components/tables.css
  - assets/stylesheets/50-pages/about.css
  - assets/stylesheets/90-responsive.css
  - assets/stylesheets/95-print.css
  - assets/stylesheets/99-overrides.css

extra_javascript:
  - assets/javascript/page-lifecycle.js
  - assets/javascript/header-active-nav.js
  - assets/javascript/catalogue-filters.js
  - assets/javascript/snippet-modal.js

# =============================================================================
# Copyright (rendered by overrides/partials/copyright.html; year set in-browser)
# =============================================================================
